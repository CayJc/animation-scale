plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spacecay.animscale'
    compileSdk 34

    defaultConfig {
        applicationId 'com.spacecay.animscale'
        minSdk 29
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    // Fixed key so every update installs over the old one and keeps the permission grant
    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'spacecay'
            keyAlias 'animscale'
            keyPassword 'spacecay'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
